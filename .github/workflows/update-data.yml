name: 每日更新優惠資料（免費爬蟲）

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取網頁並更新資料
        run: node data/scrape.mjs

      - name: 儲存變更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "資料沒有變動"
          else
            git commit -m "自動更新優惠資料 $(date -u +%Y-%m-%d)"
            git push
          fi
